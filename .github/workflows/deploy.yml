name: Deploy webapp lên GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'shared/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Kiểm tra và build
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm tra lint
        run: npm run lint

      - name: Kiểm tra kiểu
        run: npm run typecheck

      - name: Chạy test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Triển khai
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
